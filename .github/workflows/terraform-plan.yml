name: Terraform Plan

on:
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-plan.yml'

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: terraform-plan-${{ github.head_ref }}
  cancel-in-progress: true

env:
  AWS_REGION: eu-west-1
  TERRAFORM_VERSION: '1.15.8'
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'

defaults:
  run:
    working-directory: ./terraform

jobs:
  plan:
    name: plan
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.1.7

      - name: Assume AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@v4.0.2
        with:
          role-to-assume: arn:aws:iam::286325277771:role/GitHubActionsRole
          role-session-name: gha-terraform-plan-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

      - name: Initialise backend
        run: terraform init -lockfile=readonly

      - name: Validate configuration
        run: terraform validate -no-color

      - name: Generate plan
        id: plan
        env:
          TF_VAR_github_token: ${{ secrets.GH_PAT_TOKEN }}
        run: |
          set -o pipefail
          terraform plan -out=tfplan -no-color | tee plan.txt

      - name: Publish plan to job summary
        if: always()
        run: |
          {
            printf '## Terraform Plan\n\n'
            printf '```terraform\n'
            tail -c 60000 plan.txt 2>/dev/null || printf 'No plan output was produced.\n'
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish summary to pull request
        if: always()
        uses: peter-evans/create-or-update-comment@v4.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ### Terraform Plan — `${{ steps.plan.outcome }}`

            Commit `${{ github.event.pull_request.head.sha }}`

            [View the full plan output](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})